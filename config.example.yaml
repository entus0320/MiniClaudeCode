active_provider: anthropic

providers:
  anthropic:
    protocol: anthropic
    model: claude-opus-4-8
    credential_env: ANTHROPIC_API_KEY
    thinking:
      enabled: false
      effort: high
      display: omitted

  openai:
    protocol: openai
    model: gpt-5
    credential_env: OPENAI_API_KEY

  openai-compatible:
    protocol: openai-compatible
    model: your-compatible-model
    base_url: https://api.example.com/v1
    credential_env: OPENAI_API_KEY

mcp_servers: []

instructions:
  enabled: true
  project_file: MiniClaudeCode.md
  user_file: ~/.miniclaudecode/CLAUDE.md
  max_include_depth: 3

sessions:
  enabled: true
  dir: .miniclaudecode/sessions
  inactivity_notice_hours: 6

memory:
  enabled: true
  user_dir: ~/.miniclaudecode/memory
  project_dir: .miniclaudecode/memory
  auto_every_turns: 10
  recent_messages: 20

context_management:
  enabled: true
  artifact_dir: .miniclaudecode/context
  single_tool_result_token_limit: 8000
  tool_result_batch_token_limit: 24000
  tool_result_preview_chars: 2000
  compact_trigger_ratio: 0.8
  compact_target_ratio: 0.45
  # Set this to your model's real context window when the provider cannot report it.
  context_window_tokens: null
  # Used when both context_window_tokens and provider-reported window are unavailable.
  fallback_context_window_tokens: 128000
  recent_message_groups_to_keep: 6
  max_auto_compact_failures: 3


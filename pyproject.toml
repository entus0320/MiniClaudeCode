[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "miniclaudecode"
version = "0.1.0"
description = "A lightweight Python terminal AI coding assistant inspired by Claude Code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.92.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.0",
    "textual>=0.80.0",
]

[project.scripts]
miniclaudecode = "miniclaudecode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
